# Configuration for SonarCloud Automatic Analysis.
#
# Automatic Analysis ignores sonar-project.properties entirely, so this file is the
# only one that takes effect. It also does not allow wildcard patterns, which is why
# every path below is written out literally.
#
# Excluded paths:
# - .github/workflows/ci.yml: every action is pinned to a commit SHA and bun runs with
#   --ignore-scripts. The remaining githubactions:S8541/S8544 findings are generic
#   "unpinned dependency" checks that do not apply to CI-only tooling installs.
# - pyproject.toml: dependency versions are pinned by the committed uv.lock; the
#   exclusion suppresses duplicate lock-file heuristics on the metadata file.
sonar.exclusions=.github/workflows/ci.yml,pyproject.toml

# Tests and the bundled static dashboard are exercised by the browser/unit test jobs.
sonar.tests=tests
sonar.test.exclusions=tests/test_headless.py,tests/test_history.py,tests/test_mining_plan.py,tests/test_pause.py,tests/test_web_controls.py,tests/test_web_theme.cjs,tests/test_web_ui.cjs,tests/fixtures/history.json,tests/fixtures/web_state.json
