sonar.projectKey=0libote_TwitchDropsMiner
sonar.organization=0libote

# Exclusions for files where Sonar's generic rules are false positives for this repo.
# This project uses SonarCloud Automatic Analysis, where only sonar.exclusions is
# honored (sonar.issue.ignore.multicriteria is ignored for githubactions/text rules).
# - ci.yml: every action is pinned to a commit SHA and bun runs with --ignore-scripts;
#           the remaining githubactions:S8541/S8544 findings are generic "unpinned
#           dependency" style checks that do not apply to CI-only tooling installs.
# - pyproject.toml: dependency versions are pinned by the committed uv.lock; the
#           exclusion avoids duplicate lock-file heuristics on the metadata file.
sonar.exclusions=.github/workflows/ci.yml,pyproject.toml
sonar.test.exclusions=**/tests/**,**/web/**

# Keep specific issue ignores for the remaining async-open and PRNG false positives
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7493
sonar.issue.ignore.multicriteria.e1.resourceKey=**/twitch.py
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S2245
sonar.issue.ignore.multicriteria.e2.resourceKey=**/utils.py
