name: Validate and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-headless.txt
      - name: Validate Python and translations
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
          for file in lang/*.json; do python -m json.tool "$file" >/dev/null; done

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: tdm-next:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Twitch-Drops-Miner-Next-Windows-x64
          - os: macos-15
            artifact: Twitch-Drops-Miner-Next-macOS-arm64
          - os: macos-15-intel
            artifact: Twitch-Drops-Miner-Next-macOS-x64
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean --noconfirm build.spec
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item release -ItemType Directory
          Copy-Item "dist/Twitch Drops Miner Next" release/ -Recurse
          Copy-Item manual.txt,LICENSE,NOTICE.md "release/Twitch Drops Miner Next/"
      - name: Stage macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir release
          cp -R "dist/Twitch Drops Miner Next.app" release/
          cp manual.txt LICENSE NOTICE.md release/
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release
          if-no-files-found: error
