name: Validate and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.14"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Floor and current supported runtimes (pyproject requires >=3.10).
        python-version: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      # Read the ruff pin from pyproject.toml so the version lives in one place and
      # Dependabot's dev-extra bump is authoritative (no duplicate pin in CI).
      - name: Install dependencies and lint tooling
        run: |
          pip install -r requirements-headless.txt
          ruff_pin=$(sed -n 's/.*"ruff==\([^"]*\)".*/\1/p' pyproject.toml)
          pip install "ruff==$ruff_pin"
      - name: Validate Python and translations
        run: |
          ruff check .
          python -m compileall -q .
          python -m unittest discover -s tests -v
          for file in lang/*.json; do python -m json.tool "$file" >/dev/null; done

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install pip-audit
      # These must be able to fail the build: no "|| true" masking.
      # pip-audit requires a target: audit the declared requirements (its dependency
      # resolver needs pip, so --disable-pip cannot be combined with -r here).
      - name: Audit Python dependencies
        run: pip-audit -r requirements-headless.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # pinned to match packageManager in package.json
      - name: Audit JS dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          bun audit

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-headless.txt
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2 # pinned to match packageManager in package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      # Keep --package version in sync with package.json:devDependencies.playwright and bun.lock
      - run: bunx --package playwright@1.62.1 playwright install --with-deps chromium
      - name: Verify dashboard behavior and responsive layouts
        run: |
          python scripts/preview_web.py --port 8095 > /tmp/tdm-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8095/ >/dev/null; then break; fi
            sleep 1
          done
          bun run test

  docker:
    runs-on: ubuntu-latest
    needs: [test, security-audit, browser]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: tdm-next:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the running container
        run: |
          docker run --detach --rm --name tdm-next-smoke \
            --env TDM_WEB_TOKEN=ci-smoke-token \
            --publish 127.0.0.1:18766:8080 \
            tdm-next:test
          trap 'docker stop tdm-next-smoke' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18766/healthz >/dev/null; then
              break
            fi
            sleep 1
          done
          # /healthz bypasses auth; verify the protection is actually enabled.
          unauthenticated=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18766/)
          if [ "$unauthenticated" != "401" ]; then
            echo "Expected unauthenticated dashboard access to return 401, got $unauthenticated"
            docker logs tdm-next-smoke
            exit 1
          fi
          authenticated=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user "tdm:ci-smoke-token" http://127.0.0.1:18766/)
          if [ "$authenticated" != "200" ]; then
            echo "Expected authenticated dashboard access to return 200, got $authenticated"
            docker logs tdm-next-smoke
            exit 1
          fi
      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Publish multi-architecture image
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ghcr.io/0libote/twitchdropsminer:latest
            ${{ startsWith(github.ref, 'refs/tags/v') && format('ghcr.io/0libote/twitchdropsminer:{0}', github.ref_name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=Twitch Drops Miner Next
            org.opencontainers.image.description=Web-first community fork of DevilXD/TwitchDropsMiner
          cache-from: type=gha
          cache-to: type=gha,mode=max

