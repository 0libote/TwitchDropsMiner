name: Validate and build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-headless.txt
      - name: Validate Python and translations
        run: |
          python -m compileall -q .
          python -m unittest discover -s tests -v
          for file in lang/*.json; do python -m json.tool "$file" >/dev/null; done

  docker:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: tdm-next:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the running container
        run: |
          docker run --detach --rm --name tdm-next-smoke \
            --env TDM_ACCESS_TOKEN=ci-smoke-token \
            --publish 127.0.0.1:18766:8080 \
            tdm-next:test
          trap 'docker stop tdm-next-smoke' EXIT
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:18766/healthz && exit 0
            sleep 1
          done
          docker logs tdm-next-smoke
          exit 1
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin <<< "$GH_TOKEN"
      - name: Publish multi-architecture image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/0libote/twitchdropsminer:${{ github.ref_name }}
            ghcr.io/0libote/twitchdropsminer:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=Twitch Drops Miner Next
            org.opencontainers.image.description=Web-first community fork of DevilXD/TwitchDropsMiner
          cache-from: type=gha
          cache-to: type=gha,mode=max

  desktop:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Twitch-Drops-Miner-Next-Windows-x64
          - os: macos-15
            artifact: Twitch-Drops-Miner-Next-macOS-arm64
          - os: macos-15-intel
            artifact: Twitch-Drops-Miner-Next-macOS-x64
    runs-on: ${{ matrix.os }}
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --clean --noconfirm build.spec
      - name: Smoke-test Windows package
        if: runner.os == 'Windows'
        run: python scripts/smoke_package.py "dist/Twitch Drops Miner Next/Twitch Drops Miner Next.exe"
      - name: Smoke-test macOS package
        if: runner.os == 'macOS'
        run: python scripts/smoke_package.py "dist/Twitch Drops Miner Next.app/Contents/MacOS/Twitch Drops Miner Next"
      - name: Stage Windows artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item "release/${{ matrix.artifact }}" -ItemType Directory
          Copy-Item "dist/Twitch Drops Miner Next" "release/${{ matrix.artifact }}/" -Recurse
          Copy-Item manual.txt,LICENSE,NOTICE.md "release/${{ matrix.artifact }}/"
          Compress-Archive -Path "release/${{ matrix.artifact }}" -DestinationPath "release/${{ matrix.artifact }}.zip"
      - name: Stage macOS artifact
        if: runner.os == 'macOS'
        run: |
          mkdir -p "release/${{ matrix.artifact }}"
          cp -R "dist/Twitch Drops Miner Next.app" "release/${{ matrix.artifact }}/"
          cp manual.txt LICENSE NOTICE.md "release/${{ matrix.artifact }}/"
          ditto -c -k --sequesterRsrc --keepParent \
            "release/${{ matrix.artifact }}" \
            "release/${{ matrix.artifact }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/${{ matrix.artifact }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, docker, desktop]
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download tested desktop archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in \
            Twitch-Drops-Miner-Next-Windows-x64 \
            Twitch-Drops-Miner-Next-macOS-arm64 \
            Twitch-Drops-Miner-Next-macOS-x64
          do
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "$artifact" \
              --dir "artifacts/$artifact"
          done
      - name: Update latest GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t archives < <(find artifacts -type f -name '*.zip' -print)
          test "${#archives[@]}" -eq 3

          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f target_commitish="$GITHUB_SHA" \
            --jq .body > generated-notes.md
          {
            printf 'Latest prerelease build: `%s`\n\n' "$GITHUB_REF_NAME"
            cat generated-notes.md
          } > release-notes.md

          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/latest" \
              -f sha="$GITHUB_SHA" >/dev/null
          fi

          if gh release view latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload latest "${archives[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
            gh release edit latest \
              --repo "$GITHUB_REPOSITORY" \
              --title "Twitch Drops Miner Next — Latest prerelease ($GITHUB_REF_NAME)" \
              --notes-file release-notes.md \
              --prerelease \
              --latest
          else
            gh release create latest "${archives[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "Twitch Drops Miner Next — Latest prerelease ($GITHUB_REF_NAME)" \
              --notes-file release-notes.md \
              --prerelease \
              --latest
          fi

          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and .tagName != "latest") | .tagName' |
          while IFS= read -r old_tag; do
            gh release delete "$old_tag" --repo "$GITHUB_REPOSITORY" --yes
          done
