[project]
name = "twitch-drops-miner-next"
version = "0.1.0"
description = "Web-first community fork of TwitchDropsMiner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9,<4.0",
    "truststore",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
]
gui = [
    "Pillow",
    "pystray",
    "pywin32; sys_platform == 'win32'",
    "PyGObject<3.51; sys_platform == 'linux'",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# E/F: pycodestyle / pyflakes, I: isort, UP: pyupgrade
# Keep rule set tight; legacy warnings (BLE, PIE, etc.) are ignored to avoid churn on upstream engine.
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E731", "UP007", "UP036"]
fixable = ["I", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["cache", "channel", "constants", "exceptions", "fork_version", "gui", "history", "inventory", "platform_qol", "registry", "settings", "stats", "translate", "twitch", "utils", "version", "webui", "websocket"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
