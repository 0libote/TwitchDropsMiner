[project]
name = "twitch-drops-miner-next"
# PEP 440 form of fork_version.__version__ ("0.1.0-alpha.5"); keep both in sync.
version = "0.1.0a5"
description = "Web-first community fork of TwitchDropsMiner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9,<4.0",
    "yarl>=1.9",
    "truststore",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",  # single source of truth; ci.yml reads this pin from pyproject
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Keep lint tight on new code; formatting/isort are intentionally not enforced
# on the vendored upstream engine to avoid large Sonar diffs.
# I (isort) re-enabled after safe_loads fix; UP/B/C4/SIM staged next.
select = ["E", "F", "UP"]
ignore = ["E501", "UP007", "UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
