[project]
name = "twitch-drops-miner-next"
version = "0.1.0"
description = "Web-first community fork of TwitchDropsMiner"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9,<4.0",
    "truststore",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.6",  # keep in sync with ci.yml pip install
]
gui = [
    "Pillow",
    "pystray",
    "pywin32; sys_platform == 'win32'",
    "PyGObject<3.51; sys_platform == 'linux'",
]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
# Keep lint tight on new code; formatting/isort are intentionally not enforced
# on the vendored upstream engine to avoid large Sonar diffs.
# I (isort) re-enabled after safe_loads fix; UP/B/C4/SIM staged next.
select = ["E", "F", "UP"]
ignore = ["E501", "UP007", "UP036"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
