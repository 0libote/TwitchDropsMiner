services:
  miner:
    build: .
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      TDM_PUBLIC_URL: ${TDM_PUBLIC_URL:-}
      TDM_WEB_TOKEN: ${TDM_WEB_TOKEN:-}
    ports:
      - "${TDM_BIND_ADDRESS:-0.0.0.0}:${TDM_PUBLISHED_PORT:-8080}:8080"
    volumes:
      - tdm-data:/data
    tmpfs:
      - /tmp

volumes:
  tdm-data:
